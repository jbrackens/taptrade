name: Deploy demo (Hetzner)

# Auto-deploy the live demo (https://demo.99rtp.io player +
# https://office.99rtp.io office) on push.
#
# Mirrors the validated manual flow while keeping dependency-fetching builds on
# the GitHub runner: rsync the app dir to the box, build auth/gateway/player/
# office images on the runner, load those images onto the box, then recreate
# each container. Auth is built+recreated before gateway because gateway
# delegates session validation to auth and signup/login changes live there.
# The gateway is then built+recreated so the player/office health checks below
# validate end-to-end against the new backend; if either Go service build or
# health check fails the run aborts before touching the frontends. Runner-side
# builds avoid the demo box's unreliable outbound registry/module fetches; total
# bounded by `concurrency` and `timeout-minutes` below.
# Runs gateway migrations on every deploy. Catalog sync and market translation
# backfills are opt-in data ops. Market thumbnails live on the `market_images`
# Docker volume, so `rsync --delete` is safe (it can't touch the volume).
#
# Requires repo secrets:
#   DEPLOY_SSH_KEY           — private key for root on the box (dedicated deploy key)
#   BACKOFFICE_BASIC_AUTH_HASH — bcrypt hash for office.99rtp.io basic_auth
#   EDGE_SHARED_SECRET       — anti-spoof token shared by Caddy + gateway (openssl rand -hex 32)
#   OPENROUTER_API_KEY       — (optional) AI drafting + market translation
# Note: anyone who can run/modify this workflow or has repo admin can reach
# root on the demo box. Acceptable for a throwaway 2-6 week demo box;
# rotate/lock down (non-root deploy user) for anything longer-lived.

on:
  push:
    branches: [main]   # deploy branch (P2-06: consolidated onto main; feat/binary-exchange-engine retired 2026-06-14)
    paths:
      - 'apps/taptrade-platform/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      sync_catalog:
        description: "Run one-shot imported-market catalog sync and thumbnail rehost"
        type: boolean
        default: false
      translate_markets:
        description: "Generate cached LLM translations for markets missing locale copy"
        type: boolean
        default: false
      translate_tickers:
        description: "Optional comma-separated market tickers to target during translation backfill"
        type: string
        default: ""
      translate_limit:
        description: "Markets to scan per translation batch"
        type: string
        default: "120"
      translate_batches:
        description: "Sequential translation batches to run from the remaining high-priority queue"
        type: string
        default: "1"

concurrency:
  group: deploy-demo
  cancel-in-progress: false   # serialize: a 2-vCPU box can't take two builds; let one finish

env:
  BOX: 91.98.118.132
  SSH_OPTS: -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=20
  DEMO_DEPLOY_BRANCH_ALLOWLIST: main

jobs:
  # Deploy only commits whose CI passed (TD-018). A push to main starts this
  # workflow and the test/guard workflows at the same time; this job waits for
  # the ones that ran on this commit and fails the run if any of them failed.
  ci-gate:
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for tests and guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/wait-for-ci.sh "${{ github.sha }}" "${{ github.repository }}"

  deploy:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90   # auth+gateway Go builds (usually cached/fast) + two Next.js builds (~15-20 min each)
    steps:
      - uses: actions/checkout@v4

      - name: Release id
        # Images are also tagged with this id on the box so a later rollback
        # can restore them (apps/taptrade-platform/scripts/releases.sh).
        run: echo "RELEASE_ID=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Guard demo deploy branch
        run: |
          case " $DEMO_DEPLOY_BRANCH_ALLOWLIST " in
            *" $GITHUB_REF_NAME "*)
              echo "Deploy branch allowed: $GITHUB_REF_NAME"
              ;;
            *)
              echo "::error::Refusing to deploy '$GITHUB_REF_NAME'. Live demo deploys are allowed only from: $DEMO_DEPLOY_BRANCH_ALLOWLIST"
              echo "::error::Deploy from main (the consolidated mainline)."
              exit 1
              ;;
          esac

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$BOX" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Free disk space on the box
        # 2026-07-12: a deploy failed mid-migration with Postgres "No space
        # left on device" — the box accumulates a docker image generation
        # per deploy. Volume-safe cleanup only: prune unused images/
        # containers/networks + build cache (NEVER --volumes), cap the
        # journal, drop apt caches. Fails the deploy loudly if the disk is
        # still >90% full afterwards, instead of corrupting a migration.
        # Release images: keep the newest three releases' tagged images for
        # rollback (releases.sh prune), then prune only untagged images —
        # `docker system prune -a` would delete every retained release.
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" 'bash -s -- prune' \
            < apps/taptrade-platform/scripts/releases.sh
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            set -e
            df -h / | tail -1
            docker container prune -f 2>/dev/null | tail -1 || true
            docker network prune -f 2>/dev/null | tail -1 || true
            docker image prune -f 2>/dev/null | tail -1 || true
            docker builder prune -af 2>/dev/null | tail -1 || true
            journalctl --vacuum-size=200M 2>/dev/null | tail -1 || true
            apt-get clean 2>/dev/null || true
            df -h / | tail -1
            USED=$(df --output=pcent / | tail -1 | tr -dc 0-9)
            if [ "$USED" -gt 90 ]; then
              echo "::error::Disk still ${USED}% full after cleanup — manual intervention needed before migrations can run safely."
              exit 1
            fi'

      - name: Rsync app dir to the box
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy $SSH_OPTS" \
            --exclude node_modules --exclude .next --exclude .git --exclude '*.log' \
            --exclude test-results --exclude playwright-report --exclude coverage \
            apps/taptrade-platform/ root@"$BOX":/opt/phoenix/

      - name: Patch Caddyfile basic_auth hash on box
        # The committed Caddyfile keeps `admin REPLACE_WITH_BCRYPT_HASH` so the
        # bcrypt hash never lives in source control. The rsync above clobbers
        # the live file with that placeholder; restore the real hash from the
        # BACKOFFICE_BASIC_AUTH_HASH secret here BEFORE anything triggers a
        # Caddy reload. If the secret is missing we hard-fail rather than risk
        # the next reload reading the placeholder and breaking basic_auth.
        env:
          BACKOFFICE_BASIC_AUTH_HASH: ${{ secrets.BACKOFFICE_BASIC_AUTH_HASH }}
        run: |
          if [ -z "$BACKOFFICE_BASIC_AUTH_HASH" ]; then
            echo "::error::BACKOFFICE_BASIC_AUTH_HASH secret is unset — aborting before Caddy goes stale."
            echo "Generate the hash with:  docker run --rm caddy:2 caddy hash-password --plaintext 'YOURPASS'"
            echo "Then add it to repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Pipe the hash via stdin (no shell expansion of $ etc.); python
          # does literal str.replace (bcrypt hashes contain $/. which are
          # painful for sed). Fails loudly if the placeholder isn't present.
          printf '%s' "$BACKOFFICE_BASIC_AUTH_HASH" | \
            ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" \
              'python3 -c "import sys; h=sys.stdin.read().strip(); p=\"/opt/phoenix/Caddyfile\"; src=open(p).read(); assert \"REPLACE_WITH_BCRYPT_HASH\" in src, \"placeholder missing in /opt/phoenix/Caddyfile — schema drift or already patched out-of-band\"; open(p,\"w\").write(src.replace(\"REPLACE_WITH_BCRYPT_HASH\", h)); print(\"Caddyfile basic_auth hash patched\")"'

      - name: Inject secrets into box .env (compose substitution)
        # docker-compose.demo.yml reads these from /opt/phoenix/.env (compose
        # auto-reads ./.env from the project dir). Secrets are piped via stdin
        # so they never appear in a command line / process list. MUST run after
        # the rsync (which --deletes a pre-existing .env), so it is re-written
        # every deploy.
        #   OPENROUTER_API_KEY  — office AI drafting + gateway market translation
        #   EDGE_SHARED_SECRET  — anti-spoof header Caddy stamps → gateway validates
        #   *_OAUTH_*           — social login provider credentials (auth service);
        #                         an unset provider stays OFF (start returns
        #                         "not configured"), so missing secrets are safe.
        # If OPENROUTER_API_KEY is unset, drafting fails closed (app unaffected).
        # EDGE_SHARED_SECRET is required — Caddy and gateway both use the :? guard.
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDGE_SHARED_SECRET: ${{ secrets.EDGE_SHARED_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          DISCORD_OAUTH_CLIENT_ID: ${{ secrets.DISCORD_OAUTH_CLIENT_ID }}
          DISCORD_OAUTH_CLIENT_SECRET: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
          FACEBOOK_OAUTH_CLIENT_ID: ${{ secrets.FACEBOOK_OAUTH_CLIENT_ID }}
          FACEBOOK_OAUTH_CLIENT_SECRET: ${{ secrets.FACEBOOK_OAUTH_CLIENT_SECRET }}
          TWITTER_OAUTH_CLIENT_ID: ${{ secrets.TWITTER_OAUTH_CLIENT_ID }}
          TWITTER_OAUTH_CLIENT_SECRET: ${{ secrets.TWITTER_OAUTH_CLIENT_SECRET }}
          TIKTOK_OAUTH_CLIENT_KEY: ${{ secrets.TIKTOK_OAUTH_CLIENT_KEY }}
          TIKTOK_OAUTH_CLIENT_SECRET: ${{ secrets.TIKTOK_OAUTH_CLIENT_SECRET }}
          REDDIT_OAUTH_CLIENT_ID: ${{ secrets.REDDIT_OAUTH_CLIENT_ID }}
          REDDIT_OAUTH_CLIENT_SECRET: ${{ secrets.REDDIT_OAUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$EDGE_SHARED_SECRET" ]; then
            echo "::error::EDGE_SHARED_SECRET repo secret is unset — Caddy and gateway will refuse to start."
            echo "Generate one with:  openssl rand -hex 32"
            echo "Then add it to repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          {
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'EDGE_SHARED_SECRET=%s\n' "$EDGE_SHARED_SECRET"
            printf 'ROCKETCHAT_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'STORE_WEBHOOK_SECRET=%s\n' "$(openssl rand -hex 24)"
            printf 'CHAT_PUBLIC_URL=https://demo.99rtp.io/chat\n'
            printf 'CHAT_PARENT_ORIGIN=https://demo.99rtp.io\n'
            printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$GOOGLE_OAUTH_CLIENT_ID"
            printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$GOOGLE_OAUTH_CLIENT_SECRET"
            printf 'DISCORD_OAUTH_CLIENT_ID=%s\n' "$DISCORD_OAUTH_CLIENT_ID"
            printf 'DISCORD_OAUTH_CLIENT_SECRET=%s\n' "$DISCORD_OAUTH_CLIENT_SECRET"
            printf 'FACEBOOK_OAUTH_CLIENT_ID=%s\n' "$FACEBOOK_OAUTH_CLIENT_ID"
            printf 'FACEBOOK_OAUTH_CLIENT_SECRET=%s\n' "$FACEBOOK_OAUTH_CLIENT_SECRET"
            printf 'TWITTER_OAUTH_CLIENT_ID=%s\n' "$TWITTER_OAUTH_CLIENT_ID"
            printf 'TWITTER_OAUTH_CLIENT_SECRET=%s\n' "$TWITTER_OAUTH_CLIENT_SECRET"
            printf 'TIKTOK_OAUTH_CLIENT_KEY=%s\n' "$TIKTOK_OAUTH_CLIENT_KEY"
            printf 'TIKTOK_OAUTH_CLIENT_SECRET=%s\n' "$TIKTOK_OAUTH_CLIENT_SECRET"
            printf 'REDDIT_OAUTH_CLIENT_ID=%s\n' "$REDDIT_OAUTH_CLIENT_ID"
            printf 'REDDIT_OAUTH_CLIENT_SECRET=%s\n' "$REDDIT_OAUTH_CLIENT_SECRET"
          } | \
            ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" \
              'cat > /opt/phoenix/.env && printf "\nCOMPOSE_PROJECT_NAME=phoenix\n" >> /opt/phoenix/.env && chmod 600 /opt/phoenix/.env && echo ".env written ($(wc -c < /opt/phoenix/.env) bytes)"'

      - name: Add the two-factor encryption key to .env
        # AUTH_MFA_ENCRYPTION_KEY encrypts the authenticator secrets stored in
        # the database (two-factor sign-in is off until AUTH_MFA_ENABLED is
        # set; the key is kept ready), so it must outlive every deploy: it is generated once
        # on the box, kept outside the rsynced /opt/phoenix, and appended to
        # the .env written above. It is not in the database backups; losing it
        # means resetting every enrollment with `auth mfa-reset`
        # (docs/DEPLOYMENT.md).
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            set -eu
            key_file=/var/lib/taptrade/mfa.key
            mkdir -p /var/lib/taptrade
            if [ ! -s "$key_file" ]; then
              (umask 077 && head -c 32 /dev/urandom | base64 > "$key_file")
              echo "generated a new two-factor encryption key"
            fi
            chmod 600 "$key_file"
            printf "AUTH_MFA_ENCRYPTION_KEY=%s\n" "$(cat "$key_file")" >> /opt/phoenix/.env
            echo "two-factor encryption key added to .env"'

      - name: Build auth image and load on the box
        # Auth service owns signup/login/session behavior. Rebuild it before
        # gateway so auth changes ship with the same push as frontend/gateway
        # changes.
        run: |
          docker build \
            --build-arg "GOPROXY=https://proxy.golang.org|https://goproxy.io|direct" \
            -f apps/taptrade-platform/go-platform/services/auth/Dockerfile \
            -t taptrade-auth:latest \
            apps/taptrade-platform/go-platform
          docker save taptrade-auth:latest | gzip -1 | \
            ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" \
              "gunzip | docker load && docker tag taptrade-auth:latest taptrade-auth:rel-$RELEASE_ID"

      - name: Recreate auth container
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              up -d --no-deps --force-recreate auth'

      - name: Health check (auth)
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            export JWT_SECRET=unused &&
            for i in $(seq 1 24); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:18081/healthz || echo 000)
              [ "$code" = "200" ] && { echo "auth OK ($code)"; exit 0; }
              echo "attempt $i: auth /healthz=$code, retrying..."; sleep 5
            done
            echo "auth did not return 200 from /healthz after recreate"
            docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail 50 auth || true
            exit 1'

      - name: Build gateway image and load on the box
        # Build on the GitHub runner and load the image onto the box. The box
        # has repeatedly timed out fetching Go modules; keeping compilation on
        # the runner makes the deploy depend only on SSH + docker load there.
        run: |
          docker build \
            --build-arg "GOPROXY=https://proxy.golang.org|https://goproxy.io|direct" \
            -f apps/taptrade-platform/go-platform/services/gateway/Dockerfile \
            -t taptrade-gateway:latest \
            apps/taptrade-platform/go-platform
          docker save taptrade-gateway:latest | gzip -1 | \
            ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" \
              "gunzip | docker load && docker tag taptrade-gateway:latest taptrade-gateway:rel-$RELEASE_ID"

      - name: Apply gateway migrations
        # Keep DB schema ahead of the recreated gateway. The gateway image
        # carries the same migration files as source, plus the migrate helper.
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              run --rm --no-deps \
                -e MIGRATIONS_DIR=/app/migrations \
                -e MIGRATE_ALLOW_MISSING=true \
                gateway ./migrate up'

      - name: Recreate gateway container
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              up -d --no-deps --force-recreate gateway'

      - name: Health check (gateway)
        run: |
          # Probe the gateway directly on the box's published port (18080)
          # rather than through Caddy — proves the Go process is actually
          # serving, not just that the container is "running". The gateway
          # needs longer than a frontend to come up (DB connect + workers),
          # so allow ~120s. JWT_SECRET=unused is required for the compose
          # `logs` call (it interpolates services.auth.environment.JWT_SECRET).
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            export JWT_SECRET=unused &&
            for i in $(seq 1 24); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:18080/healthz || echo 000)
              [ "$code" = "200" ] && { echo "gateway OK ($code)"; exit 0; }
              echo "attempt $i: gateway /healthz=$code, retrying…"; sleep 5
            done
            echo "gateway did not return 200 from /healthz after recreate"
            docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail 50 gateway || true
            exit 1'

      - name: Start Rocket.Chat
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              up -d rocketchat'

      - name: Configure Rocket.Chat public read
        # Existing Rocket.Chat volumes can keep an older admin password, so the
        # REST login below is not a reliable place to enforce public-read
        # posture. Write the two launch-critical settings directly to Mongo and
        # restart Rocket.Chat so anonymous visitors can read #global while
        # anonymous posting stays disabled.
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            export JWT_SECRET=unused &&
            docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              exec -T rocketchat-mongo mongosh --quiet rocketchat --eval "
                db.rocketchat_settings.updateOne(
                  {_id: \"Accounts_AllowAnonymousRead\"},
                  {\$set: {value: true}},
                  {upsert: false}
                );
                db.rocketchat_settings.updateOne(
                  {_id: \"Accounts_AllowAnonymousWrite\"},
                  {\$set: {value: false}},
                  {upsert: false}
                );
                printjson(db.rocketchat_settings.find(
                  {_id: {\$in: [\"Accounts_AllowAnonymousRead\", \"Accounts_AllowAnonymousWrite\"]}},
                  {_id: 1, value: 1}
                ).toArray());
              " &&
            docker compose -f docker-compose.yml -f docker-compose.demo.yml restart rocketchat &&
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3002/api/info || echo 000)
              [ "$code" = "200" ] && { echo "Rocket.Chat restarted with public-read settings"; exit 0; }
              echo "attempt $i: Rocket.Chat /api/info=$code after settings restart, retrying..."; sleep 5
            done
            echo "Rocket.Chat did not return 200 after public-read settings restart"
            docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail 80 rocketchat || true
            exit 1'

      - name: Provision Rocket.Chat global room
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            set -a && . ./.env && set +a &&
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3002/api/info || echo 000)
              [ "$code" = "200" ] && break
              echo "attempt $i: Rocket.Chat /api/info=$code, retrying..."; sleep 5
            done
            curl -fsS http://localhost:3002/api/info >/dev/null
            login=$(curl -fsS -X POST http://localhost:3002/api/v1/login \
              -H "Content-Type: application/json" \
              -d "{\"user\":\"hula-admin\",\"password\":\"$ROCKETCHAT_ADMIN_PASSWORD\"}" || true)
            if ! printf "%s" "$login" | grep -q "\"status\":\"success\""; then
              echo "Rocket.Chat admin login did not succeed. Continuing because this may be an existing volume with an older admin password."
              exit 0
            fi
            uid=$(printf "%s" "$login" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"data\"][\"userId\"], end=\"\")")
            token=$(printf "%s" "$login" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"data\"][\"authToken\"], end=\"\")")
            curl -sS -X POST http://localhost:3002/api/v1/channels.create \
              -H "Content-Type: application/json" \
              -H "X-User-Id: $uid" \
              -H "X-Auth-Token: $token" \
              -d "{\"name\":\"global\"}" || true
          '

      - name: Build player image and load on the box
        # Build on the GitHub runner and load the image onto the box. The box
        # has timed out fetching Go modules and Yarn packages; keeping frontend
        # dependency install/build on the runner makes the box only receive a
        # completed Docker image before container recreation.
        run: |
          docker build -f apps/taptrade-platform/frontend/docker/frontend.Dockerfile \
            --build-arg module_name=app \
            --build-arg NEXT_PUBLIC_WS_URL=wss://demo.99rtp.io/ws \
            --build-arg NEXT_PUBLIC_FEATURE_CHAT=true \
            --build-arg NEXT_PUBLIC_CHAT_PUBLIC_URL=https://demo.99rtp.io/chat \
            --build-arg NEXT_PUBLIC_DEMO_SYNTHETIC_CHARTS=true \
            --build-arg NEXT_PUBLIC_HERO_AMBIENT_VIDEO=/brand/hero-ambient.mp4 \
            --build-arg NEXT_PUBLIC_FEATURE_SOCIAL_AUTH=true \
            -t predict-frontend:app-slim \
            apps/taptrade-platform/frontend
          docker save predict-frontend:app-slim | gzip -1 | \
            ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" \
              "gunzip | docker load && docker tag predict-frontend:app-slim predict-frontend:app-rel-$RELEASE_ID"

      - name: Recreate player container
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              up -d --no-deps --force-recreate player'

      - name: Optional catalog sync and thumbnail rehost
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.sync_catalog) || contains(github.event.head_commit.message, '[sync-catalog]') }}
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            set -euo pipefail
            cd /opt/phoenix
            NET=$(docker inspect predict_postgres --format "{{range \$k,\$v := .NetworkSettings.Networks}}{{\$k}}{{end}}")
            VOL=$(docker volume ls --format "{{.Name}}" | grep -E "market_images$" | head -1)
            if [ -z "$VOL" ]; then
              echo "market_images volume not found"
              exit 1
            fi
            docker run --rm --network "$NET" \
              -e GATEWAY_DB_DSN=postgres://predict:localdev@postgres:5432/predict?sslmode=disable \
              -v /opt/phoenix/go-platform:/w \
              -v "$VOL":/pub/images/markets \
              -w /w/services/gateway \
              golang:1.25 \
              go run ./cmd/sync-markets -polymarket 200 -kalshi 200 -manifold 100 -timeout 240 -public-root /pub
            docker run --rm -v "$VOL":/v alpine sh -c "chmod -R a+rX /v"
            docker restart predict_player
          '

      - name: Optional market translation backfill
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.translate_markets) || contains(github.event.head_commit.message, '[translate-markets]') }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRANSLATE_TICKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.translate_tickers || '' }}
          TRANSLATE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.translate_limit || '120' }}
          TRANSLATE_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.translate_batches || '1' }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY secret is unset — cannot generate market translations."
            exit 1
          fi
          printf "%s\n%s\n%s\n%s\n" "$OPENROUTER_API_KEY" "$TRANSLATE_TICKERS" "$TRANSLATE_LIMIT" "$TRANSLATE_BATCHES" | ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            set -euo pipefail
            IFS= read -r GITHUB_OPENROUTER_API_KEY
            IFS= read -r TRANSLATE_TICKERS
            IFS= read -r TRANSLATE_LIMIT
            IFS= read -r TRANSLATE_BATCHES
            cd /opt/phoenix
            set -a && . ./.env && set +a
            case "$TRANSLATE_LIMIT" in
              ""|*[!0-9]*)
                echo "translate_limit must be a positive integer"
                exit 1
                ;;
            esac
            case "$TRANSLATE_BATCHES" in
              ""|*[!0-9]*)
                echo "translate_batches must be a positive integer"
                exit 1
                ;;
            esac
            if [ "$TRANSLATE_LIMIT" -lt 1 ] || [ "$TRANSLATE_BATCHES" -lt 1 ]; then
              echo "translate_limit and translate_batches must be greater than zero"
              exit 1
            fi
            set -- ./translate-markets -limit "$TRANSLATE_LIMIT" -batches "$TRANSLATE_BATCHES" -timeout 1800 -request-timeout 45 -fail-on-failures=false
            if [ -n "$TRANSLATE_TICKERS" ]; then
              set -- "$@" "-tickers=$TRANSLATE_TICKERS"
              echo "Targeting market translation tickers: $TRANSLATE_TICKERS"
            fi
            echo "Starting market translation backfill: limit=$TRANSLATE_LIMIT batches=$TRANSLATE_BATCHES"
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              run --rm --no-deps \
                -e AI_TRANSLATION_API_KEY="${GITHUB_OPENROUTER_API_KEY}" \
                -e AI_TRANSLATION_ENDPOINT=https://openrouter.ai/api/v1 \
                -e AI_TRANSLATION_MODEL=openai/gpt-4o-mini \
                -e AI_TRANSLATION_PROVIDER=openai-compatible \
                gateway "$@" &
            backfill_pid=$!
            while kill -0 "$backfill_pid" 2>/dev/null; do
              echo "market translation backfill still running..."
              sleep 30
            done
            wait "$backfill_pid"
          '

      - name: Health check (player)
        run: |
          # Player is the live demo and the priority — verify it BEFORE the
          # office steps so an office-side problem can never skip this check.
          # Use the markets API: returns 200 directly (the player pages
          # 308-redirect due to next trailingSlash) and also proves the
          # Caddy -> gateway path, not just that Caddy serves a redirect.
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://demo.99rtp.io/api/v1/markets?limit=1" || echo 000)
            [ "$code" = "200" ] && { echo "live OK ($code)"; exit 0; }
            echo "attempt $i: $code, retrying…"; sleep 10
          done
          echo "demo did not return 200 after deploy"; exit 1

      - name: Live player route smoke
        run: |
          node <<'NODE'
          const base = "https://demo.99rtp.io";

          async function fetchJson(path) {
            const res = await fetch(`${base}${path}`, { redirect: "follow" });
            if (!res.ok) {
              throw new Error(`${path} returned ${res.status}`);
            }
            return res.json();
          }

          async function assertHealthyPage(path) {
            const res = await fetch(`${base}${path}`, { redirect: "follow" });
            if (!res.ok) {
              throw new Error(`${path} returned ${res.status}`);
            }
            const html = await res.text();
            if (html.length < 1000) {
              throw new Error(`${path} rendered suspiciously small HTML (${html.length} bytes)`);
            }
            if (/application error|server-side exception|something went wrong/i.test(html)) {
              throw new Error(`${path} rendered a Next/React error page`);
            }
            console.log(`${path} OK (${html.length} bytes)`);
          }

          const discovery = await fetchJson("/api/v1/discovery");
          const markets = await fetchJson("/api/v1/markets?limit=3");
          const ticker =
            discovery?.featured?.find((m) => m?.ticker)?.ticker ||
            discovery?.trending?.find((m) => m?.ticker)?.ticker ||
            markets?.markets?.find((m) => m?.ticker)?.ticker ||
            markets?.items?.find((m) => m?.ticker)?.ticker;

          if (!ticker) {
            throw new Error("No ticker available from discovery or markets API");
          }

          await assertHealthyPage("/");
          await assertHealthyPage(`/market/${encodeURIComponent(ticker)}/`);

          const regressionTicker = "IMP-485DDC71";
          const regressionApi = await fetch(`${base}/api/v1/markets/${regressionTicker}`, { redirect: "follow" });
          if (regressionApi.status === 200) {
            await assertHealthyPage(`/market/${regressionTicker}/`);
          } else {
            console.log(`${regressionTicker} not present on this catalog (${regressionApi.status}); skipping targeted route smoke`);
          }
          NODE

      - name: Build office image and load on the box
        # Same pattern as player: build dependencies on the runner, then load a
        # completed image onto the box before recreating the office container.
        run: |
          docker build -f apps/taptrade-platform/frontend/docker/frontend.Dockerfile \
            --build-arg module_name=office \
            --build-arg NEXT_PUBLIC_WS_URL=wss://office.99rtp.io/ws \
            -t predict-frontend:office-slim \
            apps/taptrade-platform/frontend
          docker save predict-frontend:office-slim | gzip -1 | \
            ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" \
              "gunzip | docker load && docker tag predict-frontend:office-slim predict-frontend:office-rel-$RELEASE_ID"

      - name: Recreate office container
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              up -d --no-deps --force-recreate office'

      - name: Office container health
        run: |
          # office.99rtp.io sits behind Caddy basic_auth, so an external
          # HTTP probe either 401s before reaching the app (proves nothing
          # about the office upstream) or requires baking the basic-auth
          # password into this committed file (credential in source — no).
          # Instead assert on the box that the recreated office container is
          # actually up and not crash-looping. Retry to allow Next start.
          # JWT_SECRET=unused is mandatory for ANY `docker compose` call here:
          # the compose config interpolates services.auth.environment.JWT_SECRET,
          # so `ps`/`logs` error out (and the run false-fails) without it —
          # the same prefix the recreate steps already use.
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            export JWT_SECRET=unused &&
            for i in $(seq 1 12); do
              state=$(docker inspect -f "{{.State.Status}}/{{.State.Restarting}}" \
                "$(docker compose -f docker-compose.yml -f docker-compose.demo.yml ps -q office)" 2>/dev/null || echo "missing/true")
              echo "attempt $i: office=$state"
              [ "$state" = "running/false" ] && { echo "office OK"; exit 0; }
              sleep 10
            done
            echo "office container not healthy after recreate"
            docker compose -f docker-compose.yml -f docker-compose.demo.yml logs --tail 50 office || true
            exit 1'

      - name: Recreate Caddy with new config
        # `caddy reload` is NOT enough here. Caddy's volume mount is a
        # single-file bind: `./Caddyfile:/etc/caddy/Caddyfile`. rsync writes
        # via temp-file + atomic rename, which gives the host file a new
        # inode every deploy. Docker single-file bind mounts pin to the
        # ORIGINAL inode at container-start time — the container keeps
        # reading the orphaned old inode forever, even though the host path
        # points elsewhere. `caddy reload` then re-reads the stale file and
        # says "config is unchanged" → routing changes silently never
        # activate. Force-recreating Caddy re-binds to the current host
        # inode and applies the new config. ~5 s of downtime per deploy;
        # acceptable for the demo. The proper structural fix would be to
        # bind-mount the parent directory instead of the file, but that
        # touches docker-compose.demo.yml + the in-place file layout.
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              up -d --no-deps --force-recreate caddy'

      - name: Start database backup sidecar
        # Dumps the database every 6h to the db_backups volume, keeping 7 days
        # (stack/ops/backup/). Idempotent: compose leaves a running, unchanged
        # sidecar alone. Before 2026-09-29 it had to be started by hand and
        # was not running on the demo.
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            cd /opt/phoenix &&
            JWT_SECRET=unused docker compose -f docker-compose.yml -f docker-compose.demo.yml \
              up -d --no-deps db-backup &&
            docker ps --filter name=predict_db_backup --format "{{.Names}} {{.Status}}"'

      - name: Record release
        # Adds this release to /var/lib/taptrade/releases.log so
        # rollback-demo.yml can restore it later. Recorded once every app
        # container is up and healthy.
        run: |
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" "bash -s -- record $RELEASE_ID" \
            < apps/taptrade-platform/scripts/releases.sh

      - name: Firewall origin to Cloudflare IPs
        # Restrict :80/:443 to CF ranges so direct-to-origin requests can't
        # forge CF-IPCountry. Re-runs every deploy to pick up new ranges.
        #
        # This step FAILS the run when the firewall doesn't come up (it used
        # to emit a yellow ::warning::). The 2026-07-28 incident: a teardown
        # bug left CF-ALLOW empty-but-referenced on every deploy — the origin
        # was directly reachable for weeks and the only signal was a warning
        # nobody had to act on. The app is already deployed by this step, so
        # a red run here means "live, but the origin is not locked down" —
        # which is exactly the thing that must not be quietly tolerated.
        # The script self-verifies (references present + DROP rule in place)
        # and exits non-zero if the filter is not actually in force.
        run: |
          # Keep the boot-time unit in sync with the repo (rsync lands the
          # file under /opt/phoenix; systemd needs it in /etc). Idempotent:
          # only reloads when the content actually changed.
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" '
            SRC=/opt/phoenix/scripts/security/cf-firewall.service
            DST=/etc/systemd/system/cf-firewall.service
            if [ -f "$SRC" ] && ! cmp -s "$SRC" "$DST"; then
              cp "$SRC" "$DST" && systemctl daemon-reload && systemctl enable cf-firewall.service
              echo "cf-firewall.service updated + enabled"
            else
              echo "cf-firewall.service unchanged"
            fi' || echo "::warning::could not sync cf-firewall.service unit"
          ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" \
            'bash /opt/phoenix/scripts/security/cf-firewall.sh' || {
              echo "::error::cf-firewall.sh failed — the origin may be reachable directly. EDGE_SHARED_SECRET still guards the money paths, but fix the firewall now."
              ssh -i ~/.ssh/deploy $SSH_OPTS root@"$BOX" \
                'echo "--- CF-ALLOW (v4) ---"; iptables -S CF-ALLOW 2>&1 | head -3;
                 echo "--- references ---"; iptables -S | grep -- "-j CF-ALLOW$" || echo "(none)"' || true
              exit 1
            }
