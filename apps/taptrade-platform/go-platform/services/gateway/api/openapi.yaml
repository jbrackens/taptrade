    get:
      summary: List the purchasable point-pack catalogue for the caller
      description: Point store surface, registered only when STORE_ENABLED is true. Serves active packs inside their promo windows with intro-only eligibility applied, plus the caller's first-purchase flag. Point pack purchases credit non-redeemable gameplay points one way.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Point pack catalogue with eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorePackListResponse" }
        "403": { description: Authentication required }
  /api/v1/store/checkout:
    post:
      summary: Create a point pack checkout for the caller
      description: Resolves price and point amounts server-side from the pack row (the client supplies only packId plus an idempotency key), snapshots them onto a pending purchase, and registers a provider checkout session. A double-submitted idempotency key returns the same purchase with status 200.
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreCheckoutRequest" }
      responses:
        "201":
          description: New pending purchase with provider checkout session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreCheckoutResponse" }
        "200":
          description: Idempotent replay returning the existing purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreCheckoutResponse" }
        "403": { description: Authentication required or pack not currently purchasable }
        "404": { description: Point pack not found }
  /api/v1/store/purchases:
    get:
      summary: List the caller's point pack purchase history
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Purchase history for the session user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorePurchaseListResponse" }
        "403": { description: Authentication required }
  /api/v1/store/purchases/{id}:
    get:
      summary: Read one purchase (owner or admin)
      description: Players may only read their own purchases; admins may inspect another user's. A pending purchase re-checks the provider session, so delayed demo checkouts complete here once their delay elapses — fulfillment stays server-side and idempotent.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Purchase status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorePurchaseStatusResponse" }
        "403": { description: Cannot access another user's purchase }
        "404": { description: Purchase not found }
  /api/v1/store/purchases/{id}/confirm:
    post:
      summary: Confirm a simulated demo checkout outcome (owner only)
      description: Demo provider only; the purchase owner conveys the outcome chosen on the labeled simulated checkout screen. Points credit exactly once through the point ledger on success; duplicate confirmations are idempotent no-ops; failed and canceled outcomes flip status without any point movement.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreConfirmRequest" }
      responses:
        "200":
          description: Confirmation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreConfirmResponse" }
        "400": { description: Unknown outcome }
        "403": { description: Only the purchase owner may confirm, or provider is not demo }
        "404": { description: Purchase not found }
        "409": { description: Purchase already in a different terminal state }
  /api/v1/store/webhook:
    post:
      summary: Receive a signature-verified provider event
      description: Public and CSRF-exempt only while STORE_ENABLED is true. The handler verifies an HMAC-SHA256 signature over the raw body (X-Store-Signature) within a five-minute timestamp window before processing; replays are idempotent no-ops backed by the purchase state machine and point ledger keys.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreWebhookEvent" }
      responses:
        "200":
          description: Event applied (or replayed idempotently)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreWebhookAck" }
        "401": { description: Invalid webhook signature }
        "404": { description: Purchase not found }
        "503": { description: Webhook secret not configured }
