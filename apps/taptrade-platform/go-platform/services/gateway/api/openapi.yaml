openapi: 3.0.3
info:
  title: Tap Trade API
  version: "1.0.0"
  description: >
    Tap Trade prediction-market gateway API for non-redeemable gameplay points.
    Binary YES/NO outcomes use point-cents subunits on a 0-100 implied
    probability scale; settled winning shares return 100 point-cents per share.
    Points are gameplay-only units with no external value path.

    Coverage: this spec documents the core public, trading, portfolio,
    responsible-play, reward, loyalty, social, leaderboard, bot, auth proxy,
    admin account-review, admin discovery taxonomy, admin market operations,
    and admin market-lifecycle surfaces verified against the live handlers and
    DTOs as of 2026-06. CMS and remaining compatibility surfaces are
    intentionally out of scope here and tracked for documentation in
    IMPROVEMENT_PLAN.md P2-05 / G-04. The previous inherited spec is archived
    outside this launch document.
servers:
  - url: http://localhost:18080
    description: Local development
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly session cookie issued by the auth service. Mutating requests also require the X-CSRF-Token header (double-submit cookie).
    BotApiKey:
      type: http
      scheme: bearer
      description: "Bot/partner API key: Authorization: Bearer tna_<prefix>_<secret>. Scopes: read, trade."
  schemas:
    Market:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        eventTitle:
          type: string
          description: Parent event's editorial title (display join; omitted when the event has no title).
        ticker: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [unopened, open, halted, closed, settled, voided, proposed_resolution, disputed] }
        result: { type: string, enum: [yes, no], nullable: true }
        yesPricePoints: { type: integer, minimum: 1, maximum: 99, description: Preferred point-native YES price on the 0-100 point-cent probability scale. }
        noPricePoints: { type: integer, minimum: 1, maximum: 99, description: Preferred point-native NO price on the 0-100 point-cent probability scale. }
        lastTradePricePoints: { type: integer, nullable: true, description: Preferred point-native last fill price in point-cents. }
        volumePoints: { type: integer, format: int64, description: Preferred point-native traded activity total in gameplay point-cents. }
        openInterestPoints: { type: integer, format: int64, description: Preferred point-native open-interest total in gameplay point-cents. }
        liquidityPoints: { type: integer, format: int64, description: Preferred point-native visible liquidity in gameplay point-cents. }
        ammSubsidyPoints: { type: integer, format: int64, description: Preferred point-native AMM fixture subsidy in gameplay point-cents. }
        collateralPoolPoints: { type: integer, format: int64, description: Preferred point-native collateral pool in gameplay point-cents. }
        settlementPoolPoints: { type: integer, format: int64, description: Preferred point-native settlement pool in gameplay point-cents. }
        bestYesBidPoints: { type: integer, nullable: true, description: Preferred point-native best YES bid in point-cents. }
        bestYesAskPoints: { type: integer, nullable: true, description: Preferred point-native best YES ask in point-cents. }
        bestNoBidPoints: { type: integer, nullable: true, description: Preferred point-native best NO bid in point-cents. }
        bestNoAskPoints: { type: integer, nullable: true, description: Preferred point-native best NO ask in point-cents. }
        unit: { type: string, enum: [PTS], description: Gameplay point unit for preferred point-native fields. }
        feeRateBps: { type: integer }
        executionMode: { type: string, enum: [order_book, amm] }
        closeAt: { type: string, format: date-time }
      required: [id, eventId, ticker, title, status, yesPricePoints, noPricePoints, unit]
    PricePoint:
      type: object
      description: Market price-history bucket. Fields use gameplay point-cents and reading history does not move points.
      properties:
        bucketStart: { type: string, format: date-time }
        yesPricePoints: { type: integer, minimum: 1, maximum: 99, description: Point-native YES price for the bucket on the 0-100 point-cent probability scale. }
        tradeCount: { type: integer, description: Number of fills represented in the bucket. }
        volumePoints: { type: integer, format: int64, description: Point-native fill activity represented by this bucket in gameplay point-cents. }
        unit: { type: string, enum: [PTS], description: Gameplay point unit for preferred point-native fields. }
      required: [bucketStart, yesPricePoints, tradeCount, volumePoints, unit]
    MarketPriceHistory:
      type: object
      description: Market price-history buckets with point-native fields and no point movement.
      properties:
        marketId: { type: string }
        range: { type: string, enum: [1h, 1d, 1w, 1m, all] }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        bucketSec: { type: integer }
        points:
          type: array
          items: { $ref: "#/components/schemas/PricePoint" }
      required: [marketId, range, since, until, bucketSec, points]
    OrderBookLevel:
      type: object
      description: Order-book price level. Price/notional fields use gameplay point-cents, share-count fields use non-monetary position shares, and reading depth does not move points.
      properties:
        pricePoints: { type: integer, minimum: 1, maximum: 99, description: Point-native level price on the 0-100 point-cent probability scale. }
        shares: { type: integer, description: Share count available at this level. }
        cumulativeShares: { type: integer, description: Cumulative share count through this level. }
        notionalPoints: { type: integer, format: int64, description: Level notional in gameplay point-cents. }
        totalNotionalPoints: { type: integer, format: int64, description: Cumulative level notional in gameplay point-cents. }
        unit: { type: string, enum: [PTS], description: Gameplay point unit for point-native fields. }
      required: [pricePoints, shares, cumulativeShares, notionalPoints, totalNotionalPoints, unit]
    OrderBookSide:
      type: object
      description: L2 bids and asks for one outcome side.
      properties:
        bids:
          type: array
          items: { $ref: "#/components/schemas/OrderBookLevel" }
        asks:
          type: array
          items: { $ref: "#/components/schemas/OrderBookLevel" }
      required: [bids, asks]
    OrderBook:
      type: object
      description: Order-book depth with point-native fields and no point movement.
      properties:
        marketId: { type: string }
        yes: { $ref: "#/components/schemas/OrderBookSide" }
        no: { $ref: "#/components/schemas/OrderBookSide" }
      required: [marketId, yes, no]
    AdminCategory:
      type: object
      description: Launch-safe discovery category metadata. Listing and editing categories does not move points.
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, slug, name, sortOrder, active]
    AdminCategoryCreateRequest:
      type: object
      description: Creates launch-safe discovery category metadata. Prohibited taxonomy terms are rejected before persistence.
      properties:
        slug: { type: string, description: Optional; defaults from the normalized name. }
        name: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }
        active: { type: boolean, default: true }
      required: [name]
    AdminSeries:
      type: object
      description: Launch-safe recurring discovery series metadata with tags. Listing and editing series does not move points.
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        categoryId: { type: string }
        frequency: { type: string }
        tags:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, slug, title, categoryId, tags, active]
    AdminSeriesCreateRequest:
      type: object
      description: Creates launch-safe recurring discovery series metadata and de-duped tags.
      properties:
        slug: { type: string, description: Optional; defaults from the normalized title. }
        title: { type: string }
        description: { type: string }
        categoryId: { type: string }
        frequency: { type: string }
        tags:
          type: array
          items: { type: string }
        active: { type: boolean, default: true }
      required: [title, categoryId]
    AdminTagListResponse:
      type: object
      description: Active discovery tags derived from active series metadata.
      properties:
        tags:
          type: array
          items: { type: string }
      required: [tags]
    PlaceOrderRequest:
      type: object
      properties:
        marketId: { type: string, format: uuid }
        side: { type: string, enum: [yes, no] }
        action: { type: string, enum: [buy, sell] }
        orderType: { type: string, enum: [market, limit] }
        pricePoints: { type: integer, minimum: 1, maximum: 99, nullable: true, description: Preferred point-native limit price on the 0-100 point-cent probability scale; required for limit orders. }
        quantity: { type: integer, minimum: 1 }
        idempotencyKey: { type: string, nullable: true }
        timeInForce: { type: string, enum: [gtc, ioc, fok], nullable: true }
        postOnly: { type: boolean }
        clientOrderId: { type: string, nullable: true }
        selfMatchAction: { type: string, enum: [cancel_taker, cancel_maker, cancel_both], nullable: true, description: Optional exchange self-match control validated before market lookup. }
        notionalCapPoints: { type: integer, format: int64, nullable: true, description: Preferred point-native alias required for market buys (maximum point-cents reserved). }
      required: [marketId, side, action, orderType, quantity]
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        marketId: { type: string, format: uuid }
        side: { type: string, enum: [yes, no] }
        action: { type: string, enum: [buy, sell] }
        orderType: { type: string, enum: [market, limit] }
        pricePoints: { type: integer, nullable: true, description: Preferred point-native limit price on the 0-100 point-cent probability scale. }
        quantity: { type: integer }
        filledQuantity: { type: integer }
        remainingQuantity: { type: integer }
        totalCostPoints: { type: integer, format: int64, description: Preferred point-native total order cost in gameplay point-cents. }
        status: { type: string, enum: [pending, open, partial, filled, cancelled, rejected, expired] }
        reservedPoints: { type: integer, format: int64, description: Preferred point-native amount locked for this order in gameplay point-cents. }
        capturedPoints: { type: integer, format: int64, description: Preferred point-native filled cost captured in gameplay point-cents. }
        releasedPoints: { type: integer, format: int64, description: Preferred point-native amount unlocked in gameplay point-cents. }
        filledCostPoints: { type: integer, format: int64, description: Preferred point-native realized filled cost in gameplay point-cents. }
        averageFillPricePoints: { type: integer, nullable: true, description: Preferred point-native average fill price on the 0-100 point-cent probability scale. }
        notionalCapPoints: { type: integer, format: int64, nullable: true, description: Preferred point-native market-buy cap in gameplay point-cents. }
        unit: { type: string, enum: [PTS], description: Gameplay point unit for preferred point-native fields. }
        createdAt: { type: string, format: date-time }
      required: [id, marketId, side, action, orderType, quantity, status]
    OrderPreview:
      type: object
      description: Non-mutating order preview. Preferred point-native fields use gameplay point-cents and do not create point movement.
      properties:
        side: { type: string, enum: [yes, no] }
        action: { type: string, enum: [buy, sell] }
        quantity: { type: integer }
        pricePoints: { type: integer, description: Preferred point-native quoted price in point-cents. }
        totalCostPoints: { type: integer, format: int64, description: Preferred point-native estimated order cost in gameplay point-cents. }
        feePoints: { type: integer, format: int64, description: Preferred point-native estimated fee in gameplay point-cents. }
        maxResultPoints: { type: integer, format: int64, description: Preferred point-native maximum possible point result in gameplay point-cents. }
        maxLossPoints: { type: integer, format: int64, description: Preferred point-native maximum loss in gameplay point-cents. }
        newYesPricePoints: { type: integer, description: Preferred point-native post-preview YES price in point-cents. }
        newNoPricePoints: { type: integer, description: Preferred point-native post-preview NO price in point-cents. }
        executionMode: { type: string, enum: [order_book, amm], nullable: true }
        filledQuantity: { type: integer }
        unfilledQuantity: { type: integer }
        averageFillPricePoints: { type: integer, description: Preferred point-native average fill price in point-cents. }
        totalCostWithFeesPoints: { type: integer, format: int64, description: Preferred point-native estimated cost including fees in gameplay point-cents. }
        estimatedSlippagePoints: { type: integer, description: Preferred point-native estimated slippage in point-cents. }
        quoteStatus: { type: string, enum: [pending, open, partial, filled, cancelled, rejected, expired], nullable: true }
        quoteStaleAfterMillis: { type: integer, format: int64, nullable: true }
        quoteGeneratedAtUnixSec: { type: integer, format: int64, nullable: true }
        unit: { type: string, enum: [PTS], description: Gameplay point unit for preferred point-native fields. }
      required: [side, action, quantity, totalCostPoints, maxLossPoints, unit]
    Position:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string }
        marketId: { type: string, format: uuid }
        side: { type: string, enum: [yes, no] }
        quantity: { type: integer }
        avgPricePoints: { type: integer, description: Preferred point-native average entry price in gameplay point-cents. }
        totalCostPoints: { type: integer, format: int64, description: Preferred point-native cost basis for the open position in gameplay point-cents. }
        realizedPoints: { type: integer, format: int64, description: Preferred point-native realized result for the position in gameplay point-cents. }
        unit: { type: string, enum: [PTS], description: Gameplay point unit for preferred point-native fields. }
      required: [id, marketId, side, quantity, avgPricePoints]
    BotOrderResponse:
      type: object
      description: Bot order result from the same point-reservation and fill path used by session orders.
      properties:
        order: { $ref: "#/components/schemas/Order" }
        trade:
          type: object
          nullable: true
          description: Filled trade details when the order executes immediately.
      required: [order]
    BotPositionsResponse:
      type: array
      description: Caller positions created by point-backed prediction orders.
      items: { $ref: "#/components/schemas/Position" }
    Trade:
      type: object
      description: Immutable public trade-tape fill row. Preferred point-native fields use gameplay point-cents.
      properties:
        id: { type: string }
        marketId: { type: string }
        buyerId: { type: string }
        sellerId: { type: string, nullable: true }
        buyOrderId: { type: string, nullable: true }
        sellOrderId: { type: string, nullable: true }
        side: { type: string, enum: [yes, no] }
        pricePoints: { type: integer, description: Preferred point-native fill price in point-cents. }
        quantity: { type: integer }
        feePoints: { type: integer, description: Preferred point-native fee in gameplay point-cents. }
        notionalPoints: { type: integer, format: int64, description: Preferred point-native fill notional in gameplay point-cents. }
        isAmmTrade: { type: boolean }
        tradedAt: { type: string, format: date-time }
        matchId: { type: string }
        tradeKind: { type: string, enum: [secondary, issuance] }
        engineKind: { type: string, enum: [order_book, amm] }
        unit: { type: string, enum: [PTS], description: Gameplay point unit for preferred point-native fields. }
      required: [id, marketId, buyerId, side, pricePoints, quantity, feePoints, notionalPoints, isAmmTrade, tradedAt, unit]
    BotAPIKey:
      type: object
      description: Bot API key metadata. Launch-issued keys use only read/trade scopes; the stored hash is never returned.
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        keyPrefix: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, trade] }
        active: { type: boolean }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, userId, name, keyPrefix, scopes, active]
    BotAPIKeyListResponse:
      type: array
      description: User-owned bot API key metadata only. Full keys are not returned after creation.
      items: { $ref: "#/components/schemas/BotAPIKey" }
    BotAPIKeyCreateRequest:
      type: object
      description: Creates a user-owned bot API key. Self-serve creation is disabled in production unless explicitly enabled. Only read and trade scopes are accepted; wildcard scopes are rejected before persistence.
      properties:
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, trade] }
          description: Defaults to read when omitted. Trade scope allows order entry through the guarded bot order route; wildcard scopes are rejected before persistence.
      required: [name]
    BotAPIKeyCreateResponse:
      allOf:
        - { $ref: "#/components/schemas/BotAPIKey" }
        - type: object
          description: Creation response. The full key is returned once and is not stored in retrievable form.
          properties:
            key: { type: string, description: Full `tna_` API key shown only on creation. }
            note: { type: string }
          required: [key, note]
    BotAPIKeyRevokeResponse:
      type: object
      description: Revocation acknowledgement for an owner-scoped bot API key.
      properties:
        status: { type: string, enum: [revoked] }
      required: [status]
    AdminPartnerKeyCreateRequest:
      type: object
      description: Operator-issued partner key request. Issuance is RBAC-gated, defaults to read scope, and rejects wildcard scopes before persistence.
      properties:
        userId: { type: string, description: Target partner user account. }
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, trade] }
        expiresInDays: { type: integer, minimum: 1, description: Defaults to 90 days when omitted. }
      required: [userId, name]
    AdminPartnerKeyCreateResponse:
      allOf:
        - { $ref: "#/components/schemas/BotAPIKeyCreateResponse" }
    AdminPartnerKeyListResponse:
      type: object
      description: Operator read of partner key metadata. Full keys are not returned after creation.
      properties:
        userId: { type: string }
        keys:
          type: array
          items: { $ref: "#/components/schemas/BotAPIKey" }
      required: [userId, keys]
    AdminPageMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        hasNext: { type: boolean }
    AdminPunter:
      type: object
      description: Admin account identity row for prediction-platform review.
      properties:
        id: { type: string }
        email: { type: string }
        username: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended, self_excluded, deactivated] }
        countryCode: { type: string, nullable: true }
        createdAt: { type: string }
        lastLoginAt: { type: string, nullable: true }
      required: [id, email, status]
    AdminPunterListItem:
      allOf:
        - { $ref: "#/components/schemas/AdminPunter" }
        - type: object
          description: Admin account row enriched with point-account summary fields.
          properties:
            pointAccountBalancePoints: { type: integer, format: int64, description: Preferred available point-account subunits for review. }
            realizedPoints: { type: integer, format: int64, description: Preferred settled prediction result subunits. }
            unit: { type: string, enum: [PTS] }
    PortfolioSummary:
      type: object
      description: Portfolio summary with point-native aliases and no point movement.
      properties:
        totalValuePoints: { type: integer, format: int64, description: Preferred open-position point-value subunits. }
        portfolioValuePoints: { type: integer, format: int64, description: Preferred portfolio point-value subunits for launch clients. }
        investedPoints: { type: integer, format: int64, description: Preferred invested point subunits for open positions. }
        unrealizedPoints: { type: integer, format: int64, description: Preferred unrealized result subunits in points. }
        realizedPoints: { type: integer, format: int64, description: Preferred realized settled-result subunits in points. }
        openPositions: { type: integer }
        totalPredictions: { type: integer }
        correctPredictions: { type: integer }
        accuracyPct: { type: number }
        unit: { type: string, enum: [PTS] }
    UserNotification:
      type: object
      description: >
        One inbox row. `payload` carries the structured event (settlement
        kind, market, side, payoutPoints in PTS) so clients render from
        data; `title`/`body` are server-rendered fallbacks.
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [settlement_paid, settlement_closed, market_voided] }
        title: { type: string }
        body: { type: string }
        marketId: { type: string }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time }
    PortfolioHistoryItem:
      type: object
      description: Settled prediction-history row with point-native result fields.
      properties:
        id: { type: string }
        settlementId: { type: string }
        positionId: { type: string }
        userId: { type: string }
        marketId: { type: string }
        side: { type: string, enum: [yes, no] }
        quantity: { type: integer }
        entryPricePoints: { type: integer, description: Entry price in gameplay point-cents. }
        exitPricePoints: { type: integer, description: Exit price in gameplay point-cents. }
        realizedPoints: { type: integer, format: int64, description: Realized prediction result in gameplay point-cents. }
        settlementPoints: { type: integer, format: int64, description: Settlement point-disbursement amount in gameplay point-cents. }
        paidAt: { type: string, format: date-time }
        unit: { type: string, enum: [PTS] }
    AdminPunterDetail:
      allOf:
        - { $ref: "#/components/schemas/AdminPunter" }
        - type: object
          description: Admin account detail with point-account and portfolio summary. This read does not move points.
          properties:
            pointAccountBalancePoints: { type: integer, format: int64, description: Preferred available point-account subunits for review. }
            portfolio: { $ref: "#/components/schemas/PortfolioSummary" }
            unit: { type: string, enum: [PTS] }
    AdminPunterSettlement:
      type: object
      description: Settled prediction-history row for admin account review.
      properties:
        id: { type: string }
        settlementId: { type: string }
        positionId: { type: string }
        userId: { type: string }
        marketId: { type: string }
        side: { type: string, enum: [yes, no] }
        quantity: { type: integer }
        entryPricePoints: { type: integer }
        exitPricePoints: { type: integer }
        realizedPoints: { type: integer, format: int64, description: Preferred realized prediction result subunits. }
        settlementPoints: { type: integer, format: int64, description: Preferred settlement point-disbursement subunits. }
        paidAt: { type: string, format: date-time }
        unit: { type: string, enum: [PTS] }
    AdminPointLedgerEntry:
      type: object
      description: Immutable point-ledger row for admin account review.
      properties:
        entryId: { type: string }
        userId: { type: string }
        type: { type: string, enum: [credit, debit, reservation, release] }
        amountPoints: { type: integer, format: int64, description: Preferred point-ledger delta subunits. }
        balancePoints: { type: integer, format: int64, description: Preferred point-account balance after the entry. }
        idempotencyKey: { type: string }
        reason: { type: string }
        transactionTime: { type: string }
        unit: { type: string, enum: [PTS] }
    AdminPunterStatusUpdateRequest:
      type: object
      properties:
        status: { type: string, enum: [active, suspended, self_excluded, deactivated] }
      required: [status]
    AdminPunterNote:
      type: object
      description: Admin account note for support and moderation review. Notes do not move points.
      properties:
        id: { type: integer, format: int64 }
        punterId: { type: string }
        authorId: { type: string, nullable: true }
        category: { type: string }
        content: { type: string }
        createdAt: { type: string }
    AdminPunterNoteRequest:
      type: object
      properties:
        content: { type: string }
        category: { type: string }
      required: [content]
    AdminAuditLog:
      type: object
      description: Admin audit row with actor, action, target, status, and details metadata.
      properties:
        id: { type: string }
        actorId: { type: string, nullable: true }
        action: { type: string }
        resourceType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        status: { type: string }
        details: { type: object, additionalProperties: true }
        occurredAt: { type: string }
    AdminEventCreateRequest:
      type: object
      description: Creates a parent prediction event in draft status. The actor is taken from the admin session.
      properties:
        seriesId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        categoryId: { type: string }
        featured: { type: boolean }
        openAt: { type: string, format: date-time, nullable: true }
        closeAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
      required: [title, categoryId, closeAt]
    AdminEvent:
      type: object
      properties:
        id: { type: string }
        seriesId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        categoryId: { type: string }
        status: { type: string, enum: [draft, open, trading_halt, closed, settling, settled, voided] }
        featured: { type: boolean }
        openAt: { type: string, format: date-time, nullable: true }
        closeAt: { type: string, format: date-time }
        settleAt: { type: string, format: date-time, nullable: true }
        settledAt: { type: string, format: date-time, nullable: true }
        metadata: { type: object, additionalProperties: true }
        createdBy: { type: string, nullable: true }
