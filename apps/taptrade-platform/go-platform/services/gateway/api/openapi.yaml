    delete:
      summary: Revoke one user-owned bot API key
      description: Revokes only keys owned by the authenticated session user. Unknown and foreign key IDs return the same not-found response to avoid exposing key existence.
      security: [{ SessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Key revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BotAPIKeyRevokeResponse" }
        "404": { description: API key not found }
  /api/v1/admin/partner-keys:
    get:
      summary: Admin list partner API keys
      description: RBAC-gated operator read for partner key metadata. Full keys are not returned after creation, and this read does not move points.
      security: [{ SessionCookie: [] }]
      parameters:
        - in: query
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Partner key metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPartnerKeyListResponse" }
        "400": { description: userId query parameter required }
    post:
      summary: Admin issue a partner API key
      description: RBAC-gated operator issuance for a target partner account. Defaults to read scope, accepts only read/trade scopes, rejects wildcard scopes before persistence, returns the full key only once, records an audit event, expires by default after 90 days, and does not move points.
      security: [{ SessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPartnerKeyCreateRequest" }
      responses:
        "201":
          description: Partner key metadata plus full key shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPartnerKeyCreateResponse" }
        "400": { description: Invalid partner key request }
        "403": { description: partners permission required }
  /api/v1/auth/login:
    post:
      summary: Log in (sets HttpOnly session cookies + CSRF token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
              required: [username, password]
      responses:
        "200": { description: Session established }
        "401": { description: Invalid credentials }
        "429": { description: Rate limited / account locked }
  /api/v1/auth/session:
    get:
      summary: Current session
      security: [{ SessionCookie: [] }]
      responses:
        "200": { description: Session info }
        "401": { description: No valid session }
