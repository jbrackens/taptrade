    PredictLeaderboardBoard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        metricKey: { type: string, description: Point-native ranking metric alias. }
        pointMetricKey: { type: string, description: Point-native ranking metric alias for launch clients. }
        window: { type: string, enum: [rolling_30d, weekly] }
        minSettled: { type: integer }
        minVolumePoints: { type: integer, format: int64, description: Point-volume threshold in gameplay point subunits when present. }
        unit: { type: string, enum: [PTS] }
        categorySlug: { type: string, nullable: true }
        rewardSummary: { type: string, description: Point qualification or rank-status copy. }
    PredictLeaderboardEntry:
      type: object
      properties:
        boardId: { type: string }
        rank: { type: integer }
        userId: { type: string }
        displayName: { type: string }
        metricValue: { type: number }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        settledCount: { type: integer, nullable: true }
    AdminLeaderboardBoard:
      type: object
      properties:
        leaderboardId: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        metricKey: { type: string }
        pointMetricKey: { type: string }
        rankingMode: { type: string }
        order: { type: string }
        status: { type: string, enum: [active] }
        unit: { type: string, enum: [PTS] }
        rewardSummary: { type: string }
    AdminLeaderboardEntry:
      type: object
      properties:
        rank: { type: integer }
        playerId: { type: string }
        displayName: { type: string }
        score: { type: number }
        eventCount: { type: integer }
    AdminLeaderboardEventRequest:
      type: object
      properties:
        playerId: { type: string }
        score: { type: number }
        activitySourceType: { type: string }
        activitySourceId: { type: string }
        idempotencyKey: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        recordedAt: { type: string, format: date-time }
      required: [playerId, score, idempotencyKey]
    AdminLeaderboardEvent:
      type: object
      properties:
        eventId: { type: string }
        leaderboardId: { type: string }
        playerId: { type: string }
        score: { type: number }
        activitySourceType: { type: string }
        activitySourceId: { type: string }
        idempotencyKey: { type: string }
        metadata:
          type: object
          additionalProperties: { type: string }
        recordedAt: { type: string, format: date-time }
        unit: { type: string, enum: [PTS] }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    GatewayStatus:
      type: object
      description: Public gateway health and launch-boundary status. Reading this endpoint does not move points.
      properties:
        service: { type: string }
        status: { type: string, enum: [up] }
        pointMode: { type: string, enum: [non_redeemable_points] }
        legacyMoneyRoutes: { type: string, enum: [disabled, enabled] }
        launchRouteDomains:
          type: array
          description: Active launch route domains.
          items: { type: string }
      required: [service, status, pointMode, legacyMoneyRoutes, launchRouteDomains]
paths:
  /api/v1/status:
    get:
      summary: Service status (public)
      responses:
        "200":
          description: Gateway launch-boundary status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayStatus" }
  /api/v1/discovery:
    get:
      summary: Discovery feed (featured, trending, closing soon) - public
      responses:
        "200": { description: Discovery sections of markets }
  /api/v1/categories:
    get:
      summary: List categories (public)
      description: Returns launch-safe active discovery categories.
      responses:
        "200":
          description: Categories array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminCategory" }
  /api/v1/categories/{slug}:
    get:
      summary: Get one category (public)
      description: Returns one launch-safe active discovery category by slug.
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCategory" }
        "404": { description: Category not found or unavailable for launch }
  /api/v1/series:
    get:
      summary: List recurring discovery series (public)
      description: Returns active series metadata. The optional categoryId filter narrows the list without moving points.
      parameters:
        - { name: categoryId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Series array
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminSeries" }
  /api/v1/tags:
    get:
      summary: List discovery tags (public)
      description: Returns active tags derived from active series metadata. The optional categoryId filter narrows the list without moving points.
      parameters:
        - { name: categoryId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTagListResponse" }
  /api/v1/events:
    get:
      summary: List events (public, paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Events page }
  /api/v1/markets:
    get:
      summary: List markets (public, paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Search term for market title/question/metadata. }
        - { name: sort, in: query, schema: { type: string, enum: [activity, closing_soon, newest] } }
        - { name: seriesId, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: closesWithinDays, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Markets page
          content:
            application/json:
              schema:
                type: object
                properties:
                  markets: { type: array, items: { $ref: "#/components/schemas/Market" } }
                  total: { type: integer }
  /api/v1/markets/{ticker}:
    get:
      summary: Get a market by ticker (falls back to id) - public
      parameters:
        - { name: ticker, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Market
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Market" }
        "404": { description: Not found }
  /api/v1/markets/{id}/trades:
    get:
      summary: Recent trade tape for a market (public)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Recent trade-tape fills with preferred point-native aliases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trade" }
  /api/v1/markets/{id}/orderbook:
    get:
      summary: Market order-book depth (public)
      description: Returns real L2 order-book depth for order-book markets with preferred point-native aliases. Reading depth is market metadata and does not move points.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
