# Production demo overlay for Path A (single box).
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
#
# Deploys are automated: pushing changes under apps/taptrade-platform/
# to feat/binary-exchange-engine triggers .github/workflows/deploy-demo.yml
# (rsync -> on-box build -> recreate player -> health check). No manual step.
#
# Base docker-compose.yml already wires postgres+redis+gateway+auth with the
# store-mode gates (WALLET_STORE_MODE/GATEWAY_READ_REPO_MODE/AUTH_STORE_MODE=db).
# This overlay (a) hardens env for a public demo, (b) adds the two Next
# standalone frontends + Caddy (the only public surface).
#
# Prereqs (validated 2026-05-17 — see DEMO_DEPLOYMENT_PLAN.md "Validation status"):
#   1. Build the slim images first (on the box, on corp VPN NOT required):
#        cd frontend
#        docker build -f docker/frontend.Dockerfile --build-arg module_name=app \
#          --build-arg NEXT_PUBLIC_WS_URL=wss://demo.99rtp.io/ws \
#          --build-arg NEXT_PUBLIC_DEMO_SYNTHETIC_CHARTS=true \
#          -t predict-frontend:app-slim .
#        (NEXT_PUBLIC_DEMO_SYNTHETIC_CHARTS keeps the seeded demo charts on the
#        legacy synthetic-walk fallback; never set it for a real-money deploy.)
#        docker build -f docker/frontend.Dockerfile --build-arg module_name=office \
#          --build-arg NEXT_PUBLIC_WS_URL=wss://office.99rtp.io/ws -t predict-frontend:office-slim .
#   2. export JWT_SECRET=$(openssl rand -hex 32)
#   3. up; then run one-shot migrate + `seed -mode demo` (Phase A2) — demo data
#      (u-1 == demo@taptrade.local) is MANDATORY or the demo looks empty.
#   4. Put the bcrypt hash in ./Caddyfile (office basic_auth).
#
# ENVIRONMENT is deliberately left UNSET (validated Path A choice): WS
# CheckOrigin then allows (no WS_ALLOWED_ORIGINS trap), wallet won't fatal,
# all seed users present. The "production-mode" guards protect against a
# misconfigured EXTERNAL dsn — N/A with a pinned local Postgres container.

# restart: unless-stopped on EVERY service. The base docker-compose.yml sets
# no restart policy; during validation a Docker Desktop auto-update restarted
# the VM (29.3.1 -> 29.4.3) and the whole demo stayed down with no recovery.
# For an unattended always-on demo ("we don't know when they'll test") a host
# or Docker restart MUST self-heal — this is the fix.
# Bound container stdout logs (added 2026-09-06). The box filled to 97% —
# ~23GB of unrotated json-file logs (the top two offenders held 14G + 8.7G)
# — and tripped the deploy's disk-space guard. json-file has NO default
# rotation, so every service gets the same cap. Applies per container on its
# next recreate; demo-ops.yml's disk_cleanup job truncates logs on a box
# that predates the cap.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    restart: unless-stopped
    logging: *default-logging
  redis:
    restart: unless-stopped
    logging: *default-logging

  rocketchat-mongo:
    image: mongo:8.0
    container_name: predict_rocketchat_mongo
    restart: unless-stopped
    logging: *default-logging
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - rocketchat_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [predict_network]

  rocketchat-mongo-init:
    image: mongo:8.0
    container_name: predict_rocketchat_mongo_init
    restart: "no"
    logging: *default-logging
    depends_on:
      rocketchat-mongo:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        mongosh --host rocketchat-mongo:27017 --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"rocketchat-mongo:27017"}]}) }'
    networks: [predict_network]

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:8.4.2
    container_name: predict_rocketchat
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      rocketchat-mongo-init:
        condition: service_completed_successfully
    ports:
      - "3002:3000"
    environment:
      ROOT_URL: "${CHAT_PUBLIC_URL:-https://demo.99rtp.io/chat}"
      PORT: "3000"
      MONGO_URL: "mongodb://rocketchat-mongo:27017/rocketchat?replicaSet=rs0"
      MONGO_OPLOG_URL: "mongodb://rocketchat-mongo:27017/local?replicaSet=rs0"
      DEPLOY_METHOD: "docker"
      INITIAL_USER: "yes"
      ADMIN_USERNAME: "taptrade-admin"
      ADMIN_NAME: "Tap Trade Demo Admin"
      ADMIN_EMAIL: "chat-admin@99rtp.io"
      ADMIN_PASS: "${ROCKETCHAT_ADMIN_PASSWORD:-change-me-before-demo}"
      OVERWRITE_SETTING_FileUpload_Enabled: "false"
      OVERWRITE_SETTING_Accounts_AllowAnonymousRead: "true"
      OVERWRITE_SETTING_Accounts_AllowAnonymousWrite: "false"
      OVERWRITE_SETTING_Accounts_iframe_enabled: "true"
      OVERWRITE_SETTING_Iframe_Integration_send_enable: "true"
      OVERWRITE_SETTING_Iframe_Integration_receive_enable: "true"
      OVERWRITE_SETTING_Iframe_Integration_send_target_origin: "${CHAT_PARENT_ORIGIN:-https://demo.99rtp.io}"
      OVERWRITE_SETTING_Iframe_Integration_receive_origin: "${CHAT_PARENT_ORIGIN:-https://demo.99rtp.io}"
      OVERWRITE_SETTING_Iframe_X_Frame_Options: "ALLOW-FROM https://demo.99rtp.io"
    networks: [predict_network]

  auth:
    image: taptrade-auth:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      AUTH_COOKIE_SECURE: "true"                 # Caddy terminates TLS; cookie is HTTPS-only
      JWT_SECRET: "${JWT_SECRET:?export a strong JWT_SECRET before up}"
      LOG_LEVEL: "info"
      # Social OAuth. Client id/secret come from /opt/phoenix/.env (written each
      # deploy from GitHub Actions secrets); a provider stays OFF until its id is
      # set (start returns "not configured"). Redirect URIs are public + fixed
      # for this box and MUST match what is registered in each provider console.
      AUTH_FRONTEND_URL: "https://demo.99rtp.io"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      GOOGLE_OAUTH_REDIRECT_URI: "https://demo.99rtp.io/api/v1/auth/oauth/google/callback"
      DISCORD_OAUTH_CLIENT_ID: "${DISCORD_OAUTH_CLIENT_ID:-}"
      DISCORD_OAUTH_CLIENT_SECRET: "${DISCORD_OAUTH_CLIENT_SECRET:-}"
      DISCORD_OAUTH_REDIRECT_URI: "https://demo.99rtp.io/api/v1/auth/oauth/discord/callback"
      FACEBOOK_OAUTH_CLIENT_ID: "${FACEBOOK_OAUTH_CLIENT_ID:-}"
      FACEBOOK_OAUTH_CLIENT_SECRET: "${FACEBOOK_OAUTH_CLIENT_SECRET:-}"
      FACEBOOK_OAUTH_REDIRECT_URI: "https://demo.99rtp.io/api/v1/auth/oauth/facebook/callback"
      TWITTER_OAUTH_CLIENT_ID: "${TWITTER_OAUTH_CLIENT_ID:-}"
      TWITTER_OAUTH_CLIENT_SECRET: "${TWITTER_OAUTH_CLIENT_SECRET:-}"
      TWITTER_OAUTH_REDIRECT_URI: "https://demo.99rtp.io/api/v1/auth/oauth/twitter/callback"
      TIKTOK_OAUTH_CLIENT_KEY: "${TIKTOK_OAUTH_CLIENT_KEY:-}"
      TIKTOK_OAUTH_CLIENT_SECRET: "${TIKTOK_OAUTH_CLIENT_SECRET:-}"
      TIKTOK_OAUTH_REDIRECT_URI: "https://demo.99rtp.io/api/v1/auth/oauth/tiktok/callback"
      REDDIT_OAUTH_CLIENT_ID: "${REDDIT_OAUTH_CLIENT_ID:-}"
      REDDIT_OAUTH_CLIENT_SECRET: "${REDDIT_OAUTH_CLIENT_SECRET:-}"
      REDDIT_OAUTH_REDIRECT_URI: "https://demo.99rtp.io/api/v1/auth/oauth/reddit/callback"

  gateway:
    image: taptrade-gateway:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      WALLET_DB_DRIVER: "postgres"
      WALLET_DB_MAX_OPEN_CONNS: "20"             # local PG max_conns=100; only real knob
      WALLET_DB_MAX_IDLE_CONNS: "4"
      LOG_LEVEL: "info"
      CHAT_DEFAULT_ROOM: "general"
      # Public-read rate limiting (incident 2026-08-16: "markets won't load").
      #
      # Neither of these was set, so the gateway ran the 120rpm default keyed
      # on r.RemoteAddr — which behind Caddy is ALWAYS the proxy's container
      # IP. Redis held exactly one bucket, rl:gateway:172.18.0.8, i.e. the
      # entire public internet shared a single 120-requests-per-minute
      # budget. A /predict load spends 3-5 of those (discovery, categories,
      # markets, events are all rate-limited prefixes), so a couple of dozen
      # page views a minute site-wide starved everyone of market data and the
      # UI rendered empty. /api/v1/status is NOT a limited prefix, which is
      # why the shell always loaded and only the data calls 429'd.
      #
      # TRUSTED_PROXY_CIDRS restores per-visitor keying: the gateway now
      # honors X-Forwarded-For when the peer is inside the compose network.
      # Private ranges are safe here because the gateway publishes no ports
      # (see this service: no `ports:` block) — only containers on
      # predict_network can reach it, so RemoteAddr cannot be an outsider.
      # Caddy pins XFF to Cloudflare's CF-Connecting-IP (see Caddyfile), so
      # the value the gateway keys on is the real client.
      # Both hops must be trusted, not just Caddy. TrustedProxyClientIP walks
      # XFF right-to-left and returns the rightmost address it does NOT
      # trust; Caddy appends its own peer (the Cloudflare edge) after our
      # header_up runs, so trusting only the compose network keyed on ~200
      # rotating CF edge IPs — verified live: rl:gateway:172.71.95.119,
      # rl:gateway:104.23.166.42. With the CF ranges trusted the walk
      # continues left to CF-Connecting-IP, the real visitor. This is what
      # the function's own doc prescribes: "Behind nested proxies, pass each
      # hop's CIDR." Ranges from cloudflare.com/ips-v4 + ips-v6, the same
      # source scripts/security/cf-firewall.sh uses; they change rarely, and
      # a stale entry degrades to edge-IP keying rather than failing open.
      GATEWAY_TRUSTED_PROXY_CIDRS: >-
        172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,
        173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,
        141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,
        197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,
        104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,
        2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,
        2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      # 600/min per visitor. Generous for a human (a fast browse burst is
      # well under 100) while still cutting off scripted abuse at 10 req/s
      # from a single address. Shared-IP users (corporate NAT, mobile
      # carriers) now share a bucket rather than the whole planet doing so.
      GATEWAY_RATELIMIT_RPM: "600"
      # no JWT_SECRET here (gateway delegates token validation to auth);
      # no GATEWAY_CORS_ORIGINS (single origin — CORS never triggers).
      # Synthetic Market Maker: dynamic two-sided liquidity on every open
      # order_book market so the CLOB is tradeable before external MMs sign.
      # Risk-bounded: $10 committed per side per market + 500-share per-side
      # position cap (worst-case ~$250 one-sided exposure per market). The bot
      # cancels stale quotes and re-quotes around the moving mid each tick, so
      # liquidity is self-healing (unlike the static demo-seed book it replaces).
      SMM_ENABLED: "true"
      SMM_DEPTH_CENTS: "1000"
      SMM_HALF_SPREAD_CENTS: "3"
      SMM_MAX_POSITION_QTY: "500"
      SMM_TICK_INTERVAL: "30s"
      # Faucet posture: "real economy rehearsal" (owner decision 2026-07-12,
      # option B). The one-time starter grant covers a few trades (1,000
      # points), the daily claim (50 points/day) keeps free players alive,
      # and paid point packs (500-12,000 points) are the meaningful top-up -
      # so the demo actually exercises the acquisition loop instead of
      # drowning it under the old 1,000,000-point grant. Values are whole
      # points despite the legacy _CENTS env names (unit model 2026-07-07).
      # Grants are idempotent, session-user-only. A REAL-MONEY deployment
      # MUST set the starter grant to 0 (the default) - see the
      # POST /api/v1/wallet/starter-grant handler.
      # 500 per the onboarding doctrine (Figma 04 Handoff): enough for a
      # real first position at typical prices, small enough to keep the
      # points economy honest.
      STARTER_GRANT_CENTS: "500"
      DAILY_CLAIM_CENTS: "50"
      # Point Store (owner decision 2026-07-12): paid point packs via the
      # DEMO provider — simulated checkout, clearly labeled, no real charges.
      # Purchases are jurisdiction-gated like deposits and count toward
      # responsible-play deposit limits. STORE_PROVIDER=stripe stays a
      # reserved seam (boot-refused until implemented; no Stripe credentials
      # exist anywhere in this deployment). The webhook secret is generated
      # per-deploy into the box .env (deploy-demo.yml) — nothing external
      # signs demo webhooks; it just must be real and non-placeholder.
      STORE_ENABLED: "true"
      STORE_PROVIDER: "demo"
      STORE_WEBHOOK_SECRET: "${STORE_WEBHOOK_SECRET:?export STORE_WEBHOOK_SECRET before up}"
      # --- Activation knobs for wired-but-unconfigured features (off by ---
      # --- default; uncomment + supply real values to take each live). ---
      # Closed Alpha custodial USDC cashier. Fails closed until explicitly
      # enabled with reviewed RPC, token, and treasury values. Keep withdrawals
      # manual-review only for Stage 1; do NOT use the legacy CRYPTO_* prototype
      # rail for this Alpha path.
      # ALPHA_CASHIER_ENABLED: "false"
      # ALPHA_CASHIER_CHAIN_ID: "8453"
      # ALPHA_CASHIER_CHAIN_NAME: "base"
      # ALPHA_CASHIER_RPC_URL: ""
      # ALPHA_CASHIER_TOKEN_SYMBOL: "USDC"
      # ALPHA_CASHIER_TOKEN_ADDRESS: ""
      # ALPHA_CASHIER_TOKEN_DECIMALS: "6"
      # ALPHA_CASHIER_TREASURY_ADDRESS: ""
      # ALPHA_CASHIER_CONFIRMATIONS: "12"
      # ALPHA_CASHIER_MIN_DEPOSIT_CENTS: "100"
      # ALPHA_CASHIER_MAX_DEPOSIT_CENTS: "25000"
      # ALPHA_CASHIER_DAILY_DEPOSIT_LIMIT_CENTS: "100000"
      # ALPHA_CASHIER_WITHDRAWALS_ENABLED: "false"
      # ALPHA_CASHIER_WITHDRAWAL_REVIEW_REQUIRED: "true"
      # ALPHA_CASHIER_WITHDRAWAL_BROADCAST_ACK: "false"
      # Two-person control on the custodial payout: the broadcaster must differ
      # from the approver (P1-13/A2-04). Required true in prod/staging when
      # withdrawals are enabled, unless explicitly acked off.
      # ALPHA_CASHIER_TWO_PERSON_WITHDRAWAL: "true"
      # ALPHA_CASHIER_TWO_PERSON_WITHDRAWAL_ACK_DISABLED: "false"
      # Sanctions/AML address screening on deposit (from) + withdrawal (to)
      # addresses (P1-12/CMP-01). With enforcement on, a non-clear verdict
      # blocks pending a real provider or review; a sanctions hit always blocks.
      # ALPHA_CASHIER_SCREENING_ENFORCEMENT: "false"
      # Deposit reorg watch: finality depth at which a credited deposit is
      # considered final (P1-14/A2-03). 0 = default (64 blocks).
      # ALPHA_CASHIER_FINALITY_CONFIRMATIONS: "0"
      # Bot/partner API keys: self-serve key creation is OFF by default in
      # prod/staging (partners get operator-issued keys); ON in dev/demo (P1-06).
      # BOT_KEYS_SELF_SERVE: "false"
      # Automated KYC vendor (manual back-office review works without these).
      # KYC_IDV_PROVIDER: "sumsub"   # or onfido / persona
      # KYC_IDV_API_KEY: ""
      # Beta policy: open Asia/Africa/LATAM with trading KYC + geo gates off.
      # NOTE deny-by-default boot policy: when ENVIRONMENT=production the
      # gateway REFUSES to boot in permissive mode (ack or no ack), and when
      # ENVIRONMENT is production/staging WITHOUT acked-permissive mode it
      # requires GEO_GATE_ENABLED=true + non-empty GEO_ALLOWED_COUNTRIES and
      # an explicit KYC posture (each KYC flag 'true' or its _ACK_DISABLED
      # set). This demo box leaves ENVIRONMENT unset, so none of that bites
      # here. See cmd/gateway/main.go validateGatewayRuntimeConfig.
      BETA_COMPLIANCE_MODE: "permissive"
      COMPLIANCE_STARTUP_ACK: "true"
      # KYC just-in-time gates (manual review + admin approval already enforce).
      # KYC_ENFORCEMENT: "true"            # gate withdrawals above threshold
      # KYC_REQUIRED_FOR_TRADING: "true"   # require verified identity to trade
      # KYC_ENFORCEMENT_ACK_DISABLED: "true"          # prod/staging only: explicit off
      # KYC_REQUIRED_FOR_TRADING_ACK_DISABLED: "true" # prod/staging only: explicit off
      # Beta launch default: $0 threshold — EVERY withdrawal requires verified
      # identity once KYC_ENFORCEMENT=true. Raise deliberately, not by accident.
      KYC_WITHDRAWAL_THRESHOLD_CENTS: "0"
      # Jurisdiction gate. Leave off for permissive beta. When enabled, it
      # covers trading AND cashier deposits/withdrawals, and it needs an edge
      # that sets the country header (e.g. Cloudflare CF-IPCountry) or the
      # gate fails closed for everyone. Allowlist mode (GEO_ALLOWED_COUNTRIES
      # non-empty) is mandatory in prod/staging. See
      # internal/compliance/geo_gate.go and docs/compliance/geofencing-kyc.md.
      # GEO_GATE_ENABLED: "true"
      # GEO_ALLOWED_COUNTRIES: "PH,ID,TH,VN,MY,SG"
      # GEO_COUNTRY_HEADER: "CF-IPCountry"
      # GEO_TRUSTED_PROXY_MODE: "require"  # loud Error+counter on missing edge signal
      # Anti-spoof edge-auth (audit SEC-03): with require-mode on, the gateway
      # rejects money-path requests lacking this shared secret, so a request
      # that skips Caddy and hits the origin directly with a forged
      # CF-IPCountry is denied. Set the SAME value on the Caddy container
      # ({$EDGE_SHARED_SECRET} in Caddyfile). REQUIRED in prod/staging when
      # GEO_TRUSTED_PROXY_MODE=require (boot fails otherwise).
      EDGE_SHARED_SECRET: "${EDGE_SHARED_SECRET:?export EDGE_SHARED_SECRET before up}"
      # Email notifications (resolution/payout). Logs until SMTP_HOST is set.
      # SMTP_HOST: ""
      # SMTP_PORT: "587"
      # SMTP_USER: ""
      # SMTP_PASSWORD: ""
      # SMTP_FROM: "no-reply@taptrade.app"
      # NOTIFY_RESOLUTION_TO: "ops@taptrade.app"
      # Server-side market translation backfill. The translate-markets helper
      # uses this same OpenRouter key path as office AI drafting, but writes
      # cached DB rows and prediction_markets.translations rather than calling
      # a model at page-render time.
      AI_TRANSLATION_PROVIDER: "openai-compatible"
      AI_TRANSLATION_ENDPOINT: "https://openrouter.ai/api/v1"
      AI_TRANSLATION_MODEL: "openai/gpt-4o-mini"
      AI_TRANSLATION_API_KEY: "${OPENROUTER_API_KEY:-}"

  player:
    image: predict-frontend:app-slim
    container_name: predict_player
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: ""                    # client same-origin; Caddy owns /api
    volumes:
      # sync-markets-rehosted market thumbnails are RUNTIME state, not source.
      # Persist them on a volume the player serves so a code rsync --delete /
      # image rebuild can't clobber them and desync DB image_url ↔ files.
      # Next standalone serves public/ from <serverdir>/public at runtime.
      - market_images:/app/packages/app/public/images/markets
    depends_on: [gateway]
    networks: [predict_network]

  office:
    image: predict-frontend:office-slim
    container_name: predict_office
    restart: unless-stopped
    logging: *default-logging
    environment:
      NEXT_PUBLIC_API_URL: ""
      # The App Router login proxy at app/api/auth/login/route.ts does a
      # SERVER-SIDE fetch to ${NEXT_PUBLIC_AUTH_URL}/api/v1/auth/login.
      # Without this, it falls back to http://localhost:18081 — i.e. the
      # office container's OWN localhost, where nothing listens — and the
      # try/catch returns "Internal server error" (500) on every login.
      # The auth service is reachable on the predict_network at service
      # name `auth`. Same name the gateway uses (see docker-compose.yml
      # AUTH_SERVICE_URL).
      NEXT_PUBLIC_AUTH_URL: "http://auth:18081"
      # --- AI market drafting (plan §16) ---
      # The draft API route (app/api/market-bot/draft/route.ts) runs SERVER-SIDE
      # in this container, so it can't use NEXT_PUBLIC_API_URL="" (same-origin is
      # browser-only). It reaches the gateway at this internal service URL — same
      # pattern as NEXT_PUBLIC_AUTH_URL above. Without it, the budget pre-flight
      # hits the office container's own localhost:18080 and fails closed (503).
      GATEWAY_INTERNAL_URL: "http://gateway:18080"
      # LLM tiers via OpenRouter (OpenAI-compatible). Both tiers share one key,
      # written to /opt/phoenix/.env at deploy from the OPENROUTER_API_KEY secret
      # (see deploy-demo.yml) — never committed here. AI_HARD_PROVIDER MUST be
      # openai-compatible to route through OpenRouter (the code default is
      # "anthropic", which would bypass the endpoint). URL fetch stays OFF at
      # launch (paste-text only): AI_URL_FETCH_ENABLED is intentionally unset.
      AI_HARD_PROVIDER: "openai-compatible"
      AI_HARD_ENDPOINT: "https://openrouter.ai/api/v1"
      AI_HARD_MODEL: "openai/gpt-4o"
      AI_HARD_API_KEY: "${OPENROUTER_API_KEY:-}"
      AI_ROUTINE_PROVIDER: "openai-compatible"
      AI_ROUTINE_ENDPOINT: "https://openrouter.ai/api/v1"
      # Routine (extraction) model. NOTE: OSS models on OpenRouter (qwen/llama)
      # do NOT support the strict structured-output mode generateObject needs
      # (verified — qwen returns unparseable output), so we use gpt-4o-mini here:
      # cheap and reliable for extraction. Both tiers verified via live smoke test.
      AI_ROUTINE_MODEL: "openai/gpt-4o-mini"
      AI_ROUTINE_API_KEY: "${OPENROUTER_API_KEY:-}"
    depends_on: [gateway]
    networks: [predict_network]

  caddy:
    image: caddy:2
    container_name: predict_caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Shared with the gateway — Caddy stamps this as X-Edge-Auth so the
      # gateway can verify requests arrived through the edge, not direct-to-origin.
      EDGE_SHARED_SECRET: "${EDGE_SHARED_SECRET:?export EDGE_SHARED_SECRET before up}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                         # persists Let's Encrypt certs across restarts
      - caddy_config:/config
    depends_on: [player, office, gateway, rocketchat]
    networks: [predict_network]

  # Automated logical backups of the Predict database. Loops pg_dump (default
  # every 6h), keeps BACKUP_RETENTION_DAYS of gzipped dumps on the db_backups
  # volume. pg_dump is read-only on the source. Local-only by default — a local
  # backup does NOT survive box loss, so set BACKUP_OFFSITE_CMD for true offsite.
  # The deploy workflow recreates named services only, so activate this once on
  # the box:
  #   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d db-backup
  db-backup:
    image: postgres:16-alpine
    container_name: predict_db_backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: predict
      PGPASSWORD: localdev               # demo only; supply real creds in production
      PGDATABASE: predict
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_INTERVAL_SECONDS: "21600"   # 6h
    volumes:
      - ./ops/backup:/ops:ro
      - db_backups:/backups
    command: ["sh", "-c", "while true; do sh /ops/backup-db.sh || true; sleep \"$$BACKUP_INTERVAL_SECONDS\"; done"]
    networks: [predict_network]

volumes:
  caddy_data:
  caddy_config:
  market_images:   # sync-markets thumbnails; survives rsync/rebuild/recreate
  db_backups:      # automated pg_dump backups (db-backup sidecar)
  rocketchat_mongo_data:

networks:
  predict_network:
